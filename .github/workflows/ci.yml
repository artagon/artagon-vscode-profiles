name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq and openssl
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq openssl

      - name: Regenerate merged settings and exports
        run: |
          bash scripts/compose-settings.sh
          bash scripts/export-profiles.sh

      - name: Assert merged and exports are in sync with sources
        run: |
          git diff --exit-code _merged/ exports/

      - name: Validate JSON fragments
        run: bash scripts/validate-json.sh

      - name: Run script test suite
        run: bash scripts/tests/run.sh
