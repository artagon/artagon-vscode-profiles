schema: spec-driven

context: |
  ## Purpose
  vsp v3.0.0 unifies Visual Studio Code profile composition, workspace setup,
  extension audits, and release generation in a native Rust CLI.

  ## Tech Stack
  - Rust workspace under crates/vsp/ using clap, serde, jsonc-parser, sha2,
    and fs4. The compiled binary embeds the catalog and packs.
  - VS Code CLI (code) for live profile, extension, and workspace operations.
  - Bash and jq for legacy vspcli compatibility shims and repository tooling.
  - Bash, Zsh, and Fish for the optional RTK terminal wrappers in
    packs/rtk-terminal/scripts/.

  ## Project Structure
  - packs/*.jsonc and packs/rtk-terminal/ define capabilities, toolchains,
    scoped settings, detection signals, dependencies, and conflicts.
  - presets.jsonc defines canonical recipes, display presets, and legacy aliases.
  - catalog/extensions.jsonc defines the extension registry, defaults, and
    lifecycle metadata. catalog/policy.jsonc defines setting scopes, forbidden
    keys, autonomy rules, and Default-profile expectations.
  - vsp.lock.json records per-platform VSIX hash locks, version locks, and
    declarative exceptions. Tier 0 compromised and removed IDs live in the
    extension catalog.
  - crates/vsp/ implements the CLI, resolver, planner, synchronization, and
    deterministic bundle exports. openspec/ records design and requirements.

  ## Core Workflows
  - vsp sync and vsp diff require explicit selectors. Standard dry-runs and
    diff use the vsp-plan/v1 planner. vsp detect is read-only.
  - vsp sync applies lossless JSONC CST edits and preserves user-owned keys.
    Profile registration uses advisory locks and a SHA-256 compare-and-swap
    check. Target provenance lives under the user's XDG state directory.
  - Profile sync runs Step 0 to remove compromised or removed extensions.
    vsp doctor returns exit 7 when required observation fails.
  - Personal composition uses the v3 user config design at
    ${XDG_CONFIG_HOME:-~/.config}/vsp/config.jsonc. Repository-local .vsp.toml
    is unsupported for security.
  - vsp dev validate checks source definitions. vsp export and vsp dev dist
    compile on demand. The 83 former build outputs under _merged/, exports/,
    and profiles/*/{extensions,settings}.json are untracked. Release jobs
    publish checksum manifests and signed build provenance.
  - Preserve the vspcli migration shim, the 15 canonical profile names,
    and all 22 legacy bundle aliases. The ai-profile aliases remain
    Copilot-only.
