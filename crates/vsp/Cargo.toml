[package]
name = "vsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[[bin]]
name = "vsp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
fs4 = "0.13"
jsonc-parser = { version = "0.26", features = ["serde", "cst"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }

[dev-dependencies]
tempfile = "3"
