[workspace]
members = ["crates/vsp"]
exclude = [
  "scripts/tests/bats/fixtures/rust-clean-doc",
  "scripts/tests/bats/fixtures/rust-broken-doc",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/trumpyla/artagon-vscode-profiles"
description = "Unified CLI and deterministic profile compiler for Artagon VS Code profiles"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Keep default `panic = "unwind"` because `crates/vsp/src/vsix.rs` relies on
# scoped worker thread panic isolation without aborting the process.
